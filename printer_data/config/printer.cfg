#   {action_respond_info("Filament runout detected")} 
# insert_gcode:
#   M117 Filament inserted
#   {action_respond_info("Filament inserted")} 

# [filament_motion_sensor jam_sensor] # BTT SFS2.0 only
# switch_pin: !PF0
# detection_length: 2.88
# extruder: extruder
# pause_on_runout: False
# runout_gcode:
#   PAUSE # [pause_resume] is required in printer.cfg
#   M117 Extrusion issues detected
#   {action_respond_info("Extrusion issues detected")} 
# insert_gcode:
#   M117 Extrusion issues resolved
#   {action_respond_info("Extrusion issues resolved")} 

[printer]
kinematics: corexy
max_velocity: 800
# max_accel: 20000
max_accel: 10000
minimum_cruise_ratio: 0.1
max_z_velocity: 20 # test with 2 if needed for z steppers
square_corner_velocity: 5.0
max_z_accel: 300 # test with 10 if needed for z steppers

[pause_resume]

#[axis_twist_compensation]
#speed: 300
#horizontal_move_z: 5
#calibrate_start_x: 20
#calibrate_end_x: 200
#calibrate_y: 112.5

[firmware_retraction]
retract_length: 0.4
retract_speed: 60
unretract_extra_length: 0
unretract_speed: 60

