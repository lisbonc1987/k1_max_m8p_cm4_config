#===PRINTER SETTINGS===

[adxl345]
cs_pin: cartographer:PA3 # Cartographer’s on-board ADXL
# cs_pin: Nozzle_MCU:PA4 # <- keep this commented as backup stock ADXL
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
   150,150,10

[input_shaper]
# # --- X axis (from ResHelper TEST_RESONANCES) ---
# shaper_type_x = 3hump_ei
# shaper_freq_x: 120.0
damping_ratio_x: 0.0273 # 153hz ish, 8.69-8.7 belt tension, using 95 accel_per_hz 
# # --- Y axis (from ResHelper TEST_RESONANCES) ---
# shaper_type_y = 2hump_ei
# shaper_freq_y: 79.0
damping_ratio_y: 0.0116 # 153hz ish, 8.69-8.7 belt tension using 115 accel_per_hz


[display_status]

# [filament_switch_sensor filament_sensor] # Stock filament sensor
# pause_on_runout: true
# switch_pin: !PC15

####----Nozzle Sensor----###
[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: !Nozzle_MCU:PA10
event_delay: 1.5
pause_delay: 0.25
insert_gcode: 
  M118 filament inserted
  M600
runout_gcode:
  M118 filament runout
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E-30 F180
    G1 E-50 F2000
    G90
  {% endif %}

