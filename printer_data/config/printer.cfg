#===PRINTER SETTINGS===

[adxl345]
cs_pin: cartographer:PA3 # Cartographer’s on-board ADXL
# cs_pin: Nozzle_MCU:PA4 # <- keep this commented as backup stock ADXL
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
   150,150,10

[input_shaper]
#shaper_freq_x: 48.6 # center frequency for the X axis filter
#shaper_type_x: zv # filter type for the X axis
#shaper_freq_y: 44.8 # center frequency for the Y axis filter
#shaper_type_y: mzv # filter type for the Y axis
#damping_ratio_x: 0.091 # damping ratio for the X axis
#damping_ratio_y: 0.033 # damping ratio for the Y axis

[display_status]

# [filament_switch_sensor filament_sensor] # Stock filament sensor
# pause_on_runout: true
# switch_pin: !PC15

####----Nozzle Sensor----###
[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: !Nozzle_MCU:PA10
event_delay: 1.5
pause_delay: 0.25
insert_gcode: 
  M118 filament inserted
  M600
runout_gcode:
  M118 filament runout
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E-30 F180
    G1 E-50 F2000
    G90
  {% endif %}

