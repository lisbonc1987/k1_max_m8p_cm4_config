[printer]
kinematics: corexy
max_velocity: 800
# max_accel: 20000
max_accel: 5500
minimum_cruise_ratio: 0.1
max_z_velocity: 20 # test with 2 if needed for z steppers
square_corner_velocity: 5.0
max_z_accel: 300 # test with 10 if needed for z steppers

[pause_resume]

