#===PRINTER SETTINGS===

[adxl345]
# cs_pin: cartographer:PA3 # Cartographer’s on-board ADXL
cs_pin: Nozzle_MCU:PA4 # <- keep this commented as backup stock ADXL
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
   154,150,10

# [input_shaper]
# # # --- X axis (from ResHelper TEST_RESONANCES) ---
# damping_ratio_x: 0.053 # 2.35 belt tension using 100 accel_per_hz with 1e5 results
# # # --- Y axis (from ResHelper TEST_RESONANCES) ---
# damping_ratio_y: 0.009 # 2.35 belt tension using 100 accel_per_hz with 1e5 results

[display_status]

# [filament_switch_sensor filament_sensor] # Stock filament sensor
# pause_on_runout: true
# switch_pin: !PC15

####----Nozzle Sensor----###
[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: !Nozzle_MCU:PA10
event_delay: 1.5
pause_delay: 0.25
insert_gcode: 
  M118 filament inserted
  M600
runout_gcode:
  M118 filament runout
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E-30 F180
    G1 E-50 F2000
    G90
  {% endif %}

# ### Enable this later if using a smart runout sensor
# [filament_switch_sensor runout_sensor] # BTT SFS2.0 only
