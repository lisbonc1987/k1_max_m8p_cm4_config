# [gcode_macro _NOZZLE_BRUSH]
# description: Universal nozzle brush (manual or start print)
# variable_start_x: 306
# variable_start_y: 35.5
# variable_end_y: 21
# variable_start_z: 3
# variable_raise_distance: 10
# variable_wipe_qty: 60
# variable_wipe_spd: 5000
# variable_wait_time: 5          # Time to let the filament soften

# # Purge settings
# variable_bucket_x: 306
# variable_bucket_y: 40
# variable_purge_z: 2
# variable_purge_cut_y1: 36
# variable_purge_cut_y2: 27
# variable_purge_amount: 5          # mm of filament to purge
# variable_purge_speed: 200          # mm/min purge speed
# variable_purge_retract: 2          # mm to retract after purge

# gcode:
#     RESPOND TYPE=command MSG="action:prompt_end"  # Close any open dialogs

#     {% set is_start_print = params.IS_START_PRINT|default(0)|int %}
#     {% set preheat_temp = params.PREHEAT_TEMP|default(150)|int %}
#     {% set brush_temp = params.BRUSH_TEMP|default(180)|int %}  # Receive temp from caller
#     {% set enable_purge = params.ENABLE_PURGE|default(1)|int %}  # Enable purge by default
    
#     M118 DEBUG: is_start_print = {is_start_print}, brush temp = {brush_temp}C, purge = {enable_purge}

#     {% if is_start_print == 0 %}
#         # M104 S{nozzle_temp}  # Heat nozzle for manual brush
#         M104 S{preheat_temp}  # Preheat temp for manual brushing
#     {% endif %}
    
#     {% if not printer.toolhead.homed_axes and is_start_print == 0 %}
#         G28  # Home only if NOT start_print and not homed
#     {% elif is_start_print == 1 %}
#         G28  # Always home when start_print is called
#     {% endif %}

#     G90  # Absolute positioning
#     G1 Z{raise_distance} F600  # Raise nozzle

#     # Move to bucket for purge
#     {% if enable_purge %}
#         G1 X{bucket_x} Y{bucket_y} Z{start_z} F1500  # Move to purge bucket
#         G1 Z{purge_z} F1500  # lower to purge z height
#         M109 S{brush_temp}  # Wait for brush temp
        
#         M118 Purging {purge_amount}mm of filament into bucket
#         M83  # Relative extrusion mode
#         G92 E0  # Reset extruder
#         G1 E{purge_amount} F{purge_speed}  # Purge filament
        
#         # Initiate purge cut
#         G1 Y{purge_cut_y1} F{wipe_spd}
#         G1 Y{purge_cut_y2} F{wipe_spd}
#         G1 Y{purge_cut_y1} F{wipe_spd}
#         G1 Y{purge_cut_y2} F{wipe_spd}
#         G1 Y{purge_cut_y1} F{wipe_spd}
#         G1 Y{purge_cut_y2} F{wipe_spd}
        
#         G1 E-{purge_retract} F{purge_speed * 5}  # Quick retract
#         G92 E0  # Reset extruder again
#         M82  # Back to absolute extrusion mode
#         G4 P1000  # Wait 1 second for ooze to settle
#     {% else %}
#         M109 S{brush_temp}  # Just heat without purging
#     {% endif %}
    
#     G1 X{start_x} Y{start_y} F1500  # Move to brush position
    
#     # M109 S{brush_temp}
    
#     # G92 E0  # Reset extruder
    
#     G1 Z{start_z} F600  # Lower to brush height

#     # # Cool down while brushing
#     # {% if is_start_print == 0 %}
#     #     M104 S0  # Cooldown for manual brush
#     #     SET_FAN_SPEED FAN=Part_Fan SPEED=1
#     # {% else %}
#     #     M104 S{preheat_temp}  # Drop to preheat temp for meshing
#     #     SET_FAN_SPEED FAN=Part_Fan SPEED=1
#     #     M118 Nozzle cooling to {preheat_temp}C for safe bed meshing
#     # {% endif %}

#     # Cool down while brushing
#     M104 S{preheat_temp}  # Drop to preheat temp for meshing
#     SET_FAN_SPEED FAN=Part_Fan SPEED=1
#     M118 Nozzle cooling to {preheat_temp}C for safe bed meshing

#     # Wipe routine
#     {% for i in range(wipe_qty) %}
#         G1 Y{end_y} F{wipe_spd}
#         G1 Y{start_y} F{wipe_spd}
#     {% endfor %}

#     # SET_FAN_SPEED FAN=Part_Fan SPEED=0  # Turn off fan

#     G1 Z{raise_distance} F600  # Raise nozzle
    
#     # Wait for cooldown to preheat_temp before turning off fan
#     {% if is_start_print == 0 %}
#         M118 Waiting for nozzle to reach {preheat_temp}C before turning off fan
#         M109 S{preheat_temp}  # Wait until 150°C is reached
#         SET_FAN_SPEED FAN=Part_Fan SPEED=0  # Now turn off fan
#         M104 S0
#     {% else %}
#         M118 Waiting for nozzle to reach {preheat_temp}C before turning off fan
#         M109 S{preheat_temp}  # Wait until 150°C is reached
#         SET_FAN_SPEED FAN=Part_Fan SPEED=0  # Now turn off fan
#     {% endif %}
    
#     M118 Brush style: booger dismantling jutsu.

