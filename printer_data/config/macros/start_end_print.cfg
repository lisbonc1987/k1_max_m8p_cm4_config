# Define global variables
[gcode_macro _START_END_PARAMS]
variable_e_min_current: 0.27
variable_enable_disable_filament_sensor: True
variable_end_print_cool_down: True
variable_end_print_cool_down_nozzle_temp: 70.0
# if target bed temp is above this the cool down is skipped
variable_end_print_cool_down_max_bed_temp: 70.0
variable_end_print_keep_bed_heated: True
variable_tip_distance: 5.0
variable_default_filament_temp: 220.0  # Default temp for manual load/
variable_z_tilt_failed: 0  # Track Z_TILT_ADJUST failure status
# Filament cooling profiles
variable_cooling_safe_filaments: ['PLA', 'PLA-AERO', 'PLA-CF']
variable_petg_variants: ['PETG', 'PETG-CF', 'PETG-CF10', 'PETG-GF']
variable_enable_bed_warp_stabilization: True  # Master enable/disable
variable_bed_warp_soak_time: 180  # Seconds to soak after reaching temp
# Smart Z positioning settings
variable_smart_z_threshold: 250  # If print < 250mm, drop bed more
variable_smart_z_short_drop: 30  # Drop 30mm for short prints
variable_smart_z_tall_drop: 2    # Drop 2mm for tall prints
gcode:

[gcode_macro NOZZLE_BRUSH]
description: Universal nozzle brush (manual or start print)
variable_nozzle_temp: 150       # Default temp
variable_wait_time: 5          # Time to let the filament soften
variable_start_x: 304.5
variable_start_y: 20
variable_end_y: 0
variable_start_z: -0.2
variable_raise_distance: 10
variable_wipe_qty: 10
variable_wipe_spd: 1500
gcode:
    {% set is_start_print = params.IS_START_PRINT | default(0) | int %}
    M118 DEBUG: is_start_print = {is_start_print}

    {% if is_start_print == 0 %}
      M104 S{nozzle_temp} ; Fire style: nozzle fire jutsu. Heat to brush right away while homing if is_start_print == 0. No 
    {% endif %}
    
    {% if not printer.toolhead.homed_axes and is_start_print == 0 %}
        G28 ; Home only if NOT start_print and not homed
        G4 P{wait_time * 1000} ; wait 5 seconds for filament to soften
    {% else %}
        G28
    {% endif %}

    G90 ; Absolute positioning
    G1 Z{raise_distance} F600 ; Raise nozzle
    G1 X{start_x} Y{start_y} F1500 ; Move to brush position

    # M109 S{nozzle_temp} ; Fire style: nozzle fire jutsu. Heat to brushing temp at brush area
    G92 E0 ; Reset extruder
    
    G1 Z{start_z} F600 ; Lower to brush height

    # M106 S255 ; Wind Style: Rasenshuriken. Turn on part cooling fan on full blast like rasenshuriken
    {% for i in range(wipe_qty) %}
        G1 Y{end_y} F{wipe_spd}
        G1 Y{start_y} F{wipe_spd}
    {% endfor %}
    
    {% if is_start_print == 0 %}
      M104 S0 # Cooldown only if is_start_print == 0
    {% endif %}
    
    # M106 S0 ; Fan off
    G1 Z{raise_distance} F600 ; Raise nozzle

    # RESPOND PREFIX="Brush style: booger dismantling jutsu. Mode: {% if is_start_print == 1 %}START_PRINT{% else %}MANUAL{% endif %}"
    M118 Brush style: booger dismantling jutsu.

[gcode_macro _WARP_STABILISE]
gcode:
    {% set TARGET_TEMP = params.TARGET_TEMP|default(0)|float %}
    {% set CURRENT_TEMP = params.CURRENT_TEMP|default(0)|float %}
    {% set soak_time = printer["gcode_macro _START_END_PARAMS"].bed_warp_soak_time|int %}
    
    M118 Bed warp stabilization: Heating from {CURRENT_TEMP}C to {TARGET_TEMP}C
    
    # Heat bed to target temp and wait
    M190 S{TARGET_TEMP}
    
    # Additional soak time for thermal expansion stabilization
    M118 Bed at temp. Soaking for {soak_time} seconds for thermal stability...
    G4 P{soak_time * 1000}  # Wait for heat soak (convert seconds to milliseconds)
    
    M118 Bed warp stabilization complete

[gcode_macro _SMART_Z_POSITION]
gcode:
  {% set threshold = printer["gcode_macro _START_END_PARAMS"].smart_z_threshold|float %}
  {% set short_drop = printer["gcode_macro _START_END_PARAMS"].smart_z_short_drop|float %}
  {% set tall_drop = printer["gcode_macro _START_END_PARAMS"].smart_z_tall_drop|float %}
  {% set current_z = printer.toolhead.position.z %}
  
  G91
  {% if current_z < threshold %}
    G1 Z{short_drop} F3000        ; lower bed 30mm for easy build plate removal
  {% else %}
    G1 Z{tall_drop} F3000         ; just lower bed 2mm for tall prints
  {% endif %}
  G90

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(105)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(245)|float %}
    {% set filament_type = params.FILAMENT_TYPE|default('PLA')|string|upper %}
    {% set enable_disable_filament_sensor = printer["gcode_macro _START_END_PARAMS"].enable_disable_filament_sensor %}
    {% set enable_bed_warp = printer["gcode_macro _START_END_PARAMS"].enable_bed_warp_stabilization %}
    {% set cooling_safe_filaments = printer["gcode_macro _START_END_PARAMS"].cooling_safe_filaments %}
    
    {% if enable_disable_filament_sensor %}
        SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
    {% endif %}
    M118 DEBUG: enable_disable_filament_sensor = {enable_disable_filament_sensor}
    
    # start heating nozzle dont wait
    m104 S{150}
    # start heating bed to desired bed temps and wait
    M140 S{BED_TEMP}

    # --- Reset slicer offsets ---
    SET_GCODE_OFFSET Z=0
    
    # --- Brush every time ---
    NOZZLE_BRUSH IS_START_PRINT=1
    
    # clear current mesh
    BED_MESH_CLEAR

    # Bed warp stabilization logic
    {% set current_bed_temp = printer.heater_bed.temperature %}
    
    # Skip bed warp for low-temp filaments (PLA, etc.)
    {% if filament_type in cooling_safe_filaments %}
        M118 Skipping bed warp stabilization - {filament_type} is a low-temp filament
        M190 S{BED_TEMP}  # Just wait for bed temp without soak
    
    # High-temp filaments: apply bed warp stabilization logic
    {% else %}
        {% if enable_bed_warp %}
            {% if current_bed_temp < (BED_TEMP * 0.99) %}
                _WARP_STABILISE TARGET_TEMP={BED_TEMP} CURRENT_TEMP={current_bed_temp}
            {% else %}
                M118 Skipping bed warp stabilization - bed already at {current_bed_temp}C
                M190 S{BED_TEMP}  # Ensure bed is at target
            {% endif %}
        {% else %}
            M118 Skipping bed warp stabilization - it is disabled
            M190 S{BED_TEMP}  # Just wait for bed temp
        {% endif %}
    {% endif %}
    
    # Z_TILT_ADJUST (no wrapper needed!)
    {% if printer.z_tilt is defined %}
        M118 Running Z_TILT_ADJUST...
        Z_TILT_ADJUST  # If it fails, Klipper cancels automatically
        M118 Z_TILT_ADJUST completed successfully
    {% endif %}

    # drop accels to prevent hyper agressive meshing
    SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=2500 SQUARE_CORNER_VELOCITY=5
    
    # Cartographer new touch command
    CARTOGRAPHER_TOUCH_HOME
    
    # start bedmesh calibrate
    BED_MESH_CALIBRATE ADAPTIVE=1

    # Start heating to final temps (non-blocking)
    M104 S{EXTRUDER_TEMP} ; Start heating extruder to final temp
    
    # wait required to prevent MCU overload / inconsistant mesh calculation
    G4 P500
    
    # park the printhead near the print area
    SMART_PARK
    
    # up acceleration back to slightly below regular travel speeds
    SET_VELOCITY_LIMIT ACCEL=18000 ACCEL_TO_DECEL=10000 SQUARE_CORNER_VELOCITY=5
    
    # wait for nozzle temperature before next step
    M109 S{EXTRUDER_TEMP}
    
    # create purge line near the print area of the part
    LINE_PURGE
    M118 3d model received. Printing initiated.
    M118 Filament Selected: {filament_type}

[gcode_macro END_PRINT]
gcode:
  # {% set end_print_cool_down = printer["gcode_macro _START_END_PARAMS"].end_print_cool_down %}
  # {% set end_print_cool_down_nozzle_temp = printer["gcode_macro _START_END_PARAMS"].end_print_cool_down_nozzle_temp|float %}
  # {% set end_print_cool_down_max_bed_temp = printer["gcode_macro _START_END_PARAMS"].end_print_cool_down_max_bed_temp|float %}
  # {% set end_print_keep_bed_heated = printer["gcode_macro _START_END_PARAMS"].end_print_keep_bed_heated %}
  {% set enable_disable_filament_sensor = printer["gcode_macro _START_END_PARAMS"].enable_disable_filament_sensor %}
  {% set tip_distance = printer["gcode_macro _START_END_PARAMS"].tip_distance|float %}
  {% set POSITION_X = printer.configfile.settings['stepper_x'].position_max * 0.99 %}
  {% set POSITION_Y = printer.configfile.settings['stepper_y'].position_max / 2 %}
  {% set filament_type = params.FILAMENT_TYPE|default('PLA')|string|upper %}
  {% set cooling_safe_filaments = printer["gcode_macro _START_END_PARAMS"].cooling_safe_filaments %}
  {% set petg_variants = printer["gcode_macro _START_END_PARAMS"].petg_variants %}
  # {% set current_z = printer.toolhead.position.z %}
  
  {% set use_cooling = filament_type in cooling_safe_filaments %}
  {% set use_gentle_cooling = filament_type in petg_variants %}

  
  M118 Print complete, cooling nozzle...
  
  {% if enable_disable_filament_sensor %}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
  {% endif %}
  
  G91
  G1 E-{tip_distance} F300        ; retract based on tip_distance
  
  ###----Test smart z position first before deleting this entirely
  # G1 Z15                          ; lift nozzle
  # G90
  # G1 X{POSITION_X} Y{POSITION_Y} F6000    ; park near front

  # Smart Z positioning based on print height
  _SMART_Z_POSITION               ; Smart Z positioning
  
  G1 X{POSITION_X} Y{POSITION_Y} F6000    ; park near front
  
  {% if use_cooling %}
    M106 P0 S255                  ; part fan full cooling for PLA
    M106 P2 S255                  ; side fan full cooling for PLA
    M109 S150                     ; cool nozzle to 150°C (wait)
    M106 P0 S0                    ; turn off part fan
    M106 P2 S0                    ; turn off side fan
  {% elif use_gentle_cooling %}
    M106 P0 S128                  ; gentle cooling for PETG (50%)
    M106 P2 S128                  ; gentle cooling for PETG (50%)
    M109 S150                     ; cool nozzle to 150°C (wait)
    M106 P0 S0                    ; turn off part fan
    M106 P2 S0                    ; turn off side fan
  {% else %}
    M109 S200                     ; cool to 200°C for ABS/ASA (no forced cooling)
  {% endif %}
  
  TURN_OFF_HEATERS                ; turn off all heaters (bed + nozzle)
  
  SET_PAUSE_NEXT_LAYER ENABLE=0
  SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
  BED_MESH_CLEAR
  EXCLUDE_OBJECT_DEFINE RESET=1
  M84                             ; disable motors

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  {% set enable_disable_filament_sensor = printer["gcode_macro _START_END_PARAMS"].enable_disable_filament_sensor %}
  {% set tip_distance = printer["gcode_macro _START_END_PARAMS"].tip_distance|float %}
  {% set cooling_safe_filaments = printer["gcode_macro _START_END_PARAMS"].cooling_safe_filaments %}
  {% set petg_variants = printer["gcode_macro _START_END_PARAMS"].petg_variants %}
  {% set POSITION_X = printer.configfile.settings['stepper_x'].position_max * 0.99 %}
  {% set POSITION_Y = printer.configfile.settings['stepper_y'].position_max / 2 %}
  {% set filament_type = params.FILAMENT_TYPE|default('PLA')|string|upper %}
  {% set current_temp = printer.extruder.temperature %}
  {% set min_extrude_temp = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}

  {% set use_cooling = filament_type in cooling_safe_filaments %}
  {% set use_gentle_cooling = filament_type in petg_variants %}
  
  M118 Print cancelled, cooling nozzle...
  
  {% if enable_disable_filament_sensor %}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
  {% endif %}
  
  G91
  # Only retract if hotend is hot enough
  {% if current_temp >= min_extrude_temp %}
    G1 E-{tip_distance} F300        ; retract based on tip_distance
  {% else %}
      M118 Skipping retraction - nozzle too cold ({current_temp}C)
  {% endif %}

  ###----Test smart z position first before deleting this entirely
  # G1 Z15                          ; lift nozzle
  # G90
  # G1 X{POSITION_X} Y{POSITION_Y} F6000    ; park near front

  _SMART_Z_POSITION               ; Smart Z positioning

  G1 X{POSITION_X} Y{POSITION_Y} F6000    ; park near front

  # Only attempt cooling if nozzle is hot
  {% if current_temp >= min_extrude_temp %}
    {% if use_cooling %}
      M106 P0 S255                  ; part fan full cooling for PLA
      M106 P2 S255                  ; side fan full cooling for PLA
      M109 S150                     ; cool nozzle to 150°C (wait)
      M106 P0 S0                    ; turn off part fan
      M106 P2 S0                    ; turn off side fan
    {% elif use_gentle_cooling %}
      M106 P0 S128                  ; gentle cooling for PETG (50%)
      M106 P2 S128                  ; gentle cooling for PETG (50%)
      M109 S150                     ; cool nozzle to 150°C (wait)
      M106 P0 S0                    ; turn off part fan
      M106 P2 S0                    ; turn off side fan
    {% else %}
      M109 S200                     ; cool to 200°C for ABS/ASA (no forced cooling)
    {% endif %}
  {% else %}
    M118 Skipping cooldown - nozzle already cold
  {% endif %}
  
  TURN_OFF_HEATERS                ; turn off all heaters (bed + nozzle)
  
  SET_PAUSE_NEXT_LAYER ENABLE=0
  SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
  BED_MESH_CLEAR
  EXCLUDE_OBJECT_DEFINE RESET=1
  CANCEL_PRINT_BASE               ; call the base cancel print command
  M84                             ; disable motors

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set z = params.Z|default(10)|int %}                                                   ; z hop amount
    {% set enable_disable_filament_sensor = printer["gcode_macro _START_END_PARAMS"].enable_disable_filament_sensor %}

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                              ; set z hop variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}    ; set hotend temp variable for reference in resume macro

        {% if enable_disable_filament_sensor %}
            SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0                              ; disable filament sensor
        {% endif %}
        SAVE_GCODE_STATE NAME=PAUSE                                                          ; save current print position for resume
        BASE_PAUSE                                                                           ; pause print
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       ; check that zhop doesn't exceed z max
            G91                                                                              ; relative positioning
            G1 Z{z} F900                                                                     ; raise Z up by z hop amount
        {% else %}
            M118 Pause zhop exceeds maximum Z height.                                        ; if z max is exceeded, show message and set zhop value for resume to 0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90                                                                                  ; absolute positioning
        G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} F6000   ; park toolhead at front center
        SAVE_GCODE_STATE NAME=PAUSEPARK                                                      ; save parked position in case toolhead is moved during the pause (otherwise the return zhop can error)
        M104 S0                                                                              ; turn off hotend
        SET_IDLE_TIMEOUT TIMEOUT=43200                                                       ; set timeout to 12 hours
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    # Parameters
    {% set e = params.E|default(2.5)|int %}                                          ; hotend prime amount (in mm)
    {% set enable_disable_filament_sensor = printer["gcode_macro _START_END_PARAMS"].enable_disable_filament_sensor %}

    {% if printer['pause_resume'].is_paused|int == 1 %}
        {% if enable_disable_filament_sensor %}
            SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1                      ; enable filament sensor
        {% endif %}
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}  ; set timeout back to configured value
        {% if etemp > 0 %}
            M109 S{etemp|int}                                                        ; wait for hotend to heat back up
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                     ; go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)
        G91                                                                          ; relative positioning
        M83                                                                          ; relative extruder positioning
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 Z{zhop * -1} E{e} F900                                                ; prime nozzle by E, lower Z back down
        {% else %}
            G1 Z{zhop * -1} F900                                                     ; lower Z back down without priming (just in case we are testing the macro with cold hotend)
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                          ; restore position
        BASE_RESUME                                                                  ; resume print
    {% endif %}


[gcode_macro _UNLOAD_FILAMENT]
gcode:
    {% set target_temp = printer['gcode_macro RESUME'].etemp|default(220)|int %}
    M109 S{target_temp}
    RESPOND TYPE=command MSG="Unloading filament..."
    # Turn on cooling fan to help with temperature drop
    M106 S255
    
    M83
    #### K1* Unicorn Nozzle/Heatbreak/Extruder Geometry:
    ## pipe - heatbreak - pipe - nozzle
    ## 23.6 - 10.5      - 3    - 28.3 - total 65.4mm
    ### Positions:
    ## E-28.3 = unloaded from nozzle/heater
    ## E-36.55 = unloaded from nozzle/hb until middle of heatbreak
    ## E-42.3 = unloaded from nozzle and hb = between heatbreak and extruder drive gears, hand pullable with lever opened
    ## E-77.5 = unloaded from nozzle, hb and extruder = beyond extruder drive gears, hand pullable with lever closed
    M118 {"Begin unload filament and tip shape"}
    M104 S{target_temp - 30}       # Start cooling (don't wait)
    G4 P5000                       # Wait for initial cooldown
    G1 E30 F180                    # initially purge larger due to nozzle length
    G1 E-12 F600                   # Medium retract -12
    G4 P1000                       # Wait
    G1 E4 F120                     # Small extrude -8
    G1 E-18 F1400                  # Fast retract -26
    G4 P500                        # Wait
    G1 E2 F90                      # Tiny extrude -24
    G1 E-24 F2200                  # Very fast retract -48
    G1 E-50 F2800                  # Final snap retract -98
      
    M400
    # turn off extruder to help it avoid overheating
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    
    # restore temperature
    M109 S{target_temp}

[gcode_macro _LOAD_FILAMENT]
gcode:
  {% set target_temp = printer['gcode_macro RESUME'].etemp|default(220)|int %}
  {% set tip_distance = printer["gcode_macro _START_END_PARAMS"].tip_distance|float %}
  M109 S{target_temp}
  M118 {"Loading filament at %d°C..." % (target_temp)}
  M83
  G1 E100 F180                     # Load filament
  G1 E-{tip_distance} F300         # Retract using your tip_distance variable
  M400
  # turn off extruder to help it avoid overheating
  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
  M118 {"Filament loaded. Resume print"}

[gcode_macro _PURGE_MORE]
gcode:
  {% set target_temp = printer['gcode_macro RESUME'].etemp|default(220)|int %}
  {% set tip_distance = printer["gcode_macro _START_END_PARAMS"].tip_distance|float %}
  M109 S{target_temp}
  M118 {"Purging filament..."}
  M83
  G1 E10 F180
  G1 E-{tip_distance} F300         # Retract using your tip_distance variable
  M400
  # turn off extruder to help it avoid overheating
  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0

[gcode_macro _FC_CANCEL]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  CANCEL_PRINT

[gcode_macro _FC_RESUME]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  RESUME

[gcode_macro M600]
description: Filament Change
gcode:
  RESPOND TYPE=command MSG="M600 - Print paused for filament change"
  PAUSE RESTORE=0
  RESPOND TYPE=command MSG="action:prompt_begin M600 - Filament Change - UNLOAD Filament"
  RESPOND TYPE=command MSG="action:prompt_text BEEP BEEP - Unloading Filament ..."
  RESPOND TYPE=command MSG="action:prompt_text ... ... ..."
  RESPOND TYPE=command MSG="action:prompt_text ... Please wait for BEEP."
  RESPOND TYPE=command MSG="action:prompt_show"
  BEEP
  BEEP
  _UNLOAD_FILAMENT
  SET_FAN_SPEED FAN=Part_Fan SPEED=0
  SET_FAN_SPEED FAN=Side_Fan SPEED=0
  RESPOND TYPE=command MSG="action:prompt_begin M600 - Filament Change - LOAD Filament"
  RESPOND TYPE=command MSG="action:prompt_text BEEP - Filament unloaded. Replace Filament, click LOAD, remove purged material and click RESUME when ready to continue print."
  RESPOND TYPE=command MSG="action:prompt_text  "
  RESPOND TYPE=command MSG="action:prompt_button LOAD Filament|_LOAD_FILAMENT|secondary"
  RESPOND TYPE=command MSG="action:prompt_button PURGE MORE Filament|_PURGE_MORE|secondary"
  RESPOND TYPE=command MSG="action:prompt_text  "
  RESPOND TYPE=command MSG="action:prompt_footer_button CANCEL PRINT|_FC_CANCEL|error"
  RESPOND TYPE=command MSG="action:prompt_footer_button IGNORE|RESPOND TYPE=command MSG=action:prompt_end|warning"
  RESPOND TYPE=command MSG="action:prompt_footer_button RESUME|_FC_RESUME|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

